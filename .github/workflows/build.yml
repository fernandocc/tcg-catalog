# Builds the Windows installer, the macOS disk images and the Linux AppImage.
# Push a tag like v1.0.0 to build them and publish a GitHub Release with the files;
# "Run workflow" on the Actions tab builds them without releasing (download from the run page).
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest          # Apple silicon (M1 and newer)
            label: Mac-AppleSilicon
          - os: macos-15-intel        # older Intel Macs
            label: Mac-Intel
          - os: ubuntu-22.04          # oldest supported glibc -> the AppImage runs on more distros
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build the app
        run: pyinstaller --noconfirm tcg_catalog.spec

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('assets/icon.png').save('build/icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
            else { choco install innosetup -y --no-progress; $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
          }
          iscc "/DMyAppVersion=$env:APP_VERSION" packaging\windows\installer.iss

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg
          cp -R "dist/TCG Catalog.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "TCG Catalog" -srcfolder build/dmg -ov -format UDZO "dist/TCG-Catalog-${APP_VERSION}-${{ matrix.label }}.dmg"

      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          packaging/linux/make_appimage.sh "$APP_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
          body: |
            **Download the file for your computer** (under *Assets* below):

            | Computer | File |
            |---|---|
            | Windows 10/11 | `…-Windows-Setup.exe` |
            | Mac with Apple chip (M1 or newer) | `…-Mac-AppleSilicon.dmg` |
            | Older Mac with Intel chip | `…-Mac-Intel.dmg` |
            | Linux | `…-Linux-x86_64.AppImage` |

            First time opening it? See the README's *Install* section — your computer will warn about an app from an unknown developer.
